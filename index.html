 <!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Free Estimator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
body {
font-family: 'Orbitron', sans-serif; background: #ffffff;
color: #000;
display: flex;
flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px;
min-height: 100vh;
position: relative;
overflow: hidden;
}
.glitter {
position: absolute;
width: 6px;
height: 6px;
background: radial-gradient(circle, rgba(255,215,0,1) 0%, rgba(255,255,255,0) 70%); border-radius: 50%;
animation: sparkle 2s infinite ease-in-out;
opacity: 0.8;
}
@keyframes sparkle {
0%, 100% { transform: scale(1) translateY(0); opacity: 0.8; } 50% { transform: scale(1.7) translateY(-6px); opacity: 1; }
}
.logo {
width: 260px;
margin-top: 25px;
margin-bottom: 10px;
filter: drop-shadow(0 0 15px rgba(184,134,11,0.4));

 }
h1 {
font-size: 1.8em;
margin-top: 10px;
text-align: center;
letter-spacing: 1px;
background: linear-gradient(90deg, #b8860b, #c19a6b, #deb887); -webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 0 10px rgba(184,134,11,0.3);
animation: glitterText 3s linear infinite;
}
@keyframes glitterText {
0% { text-shadow: 0 0 5px #b8860b, 0 0 10px #c19a6b, 0 0 20px #deb887; } 50% { text-shadow: 0 0 20px #ffd700, 0 0 30px #daa520, 0 0 45px #b8860b; } 100% { text-shadow: 0 0 5px #b8860b, 0 0 10px #c19a6b, 0 0 20px #deb887; }
}
.calculator {
background: #fffdf6;
padding: 25px;
border-radius: 20px;
box-shadow: 0 0 15px rgba(184,134,11,0.3); max-width: 420px;
width: 100%;
border: 1px solid rgba(184,134,11,0.5); margin-top: 20px;
transition: 0.3s ease;
position: relative;
overflow: hidden;
}
.calculator::before { content: ''; position: absolute; top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%,
transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent);

 background-size: 50px 50px; animation: glitterMove 4s linear infinite; pointer-events: none;
}
@keyframes glitterMove {
0% { background-position: 0 0; }
100% { background-position: 100px 100px; }
}
label {
display: block; margin-top: 10px; font-weight: bold; color: #b8860b;
}
input, select {
width: 100%;
padding: 10px;
margin-top: 4px;
border-radius: 10px;
border: 1px solid rgba(184,134,11,0.6); background-color: #fffaf0;
color: #000;
font-weight: bold; }
button {
background: linear-gradient(90deg, #b8860b 0%, #deb887 100%); color: #000;
font-weight: bold;
padding: 12px;
margin-top: 25px;
border: none;
border-radius: 10px;
cursor: pointer;
width: 100%;
transition: all 0.3s ease;
box-shadow: 0 0 10px rgba(184,134,11,0.4);
}
button:hover { transform: scale(1.05);

 box-shadow: 0 0 25px rgba(184,134,11,0.6); }
.result {
margin-top: 25px;
font-weight: bold;
font-size: 1.3em;
color: #b8860b;
text-align: center;
text-shadow: 0 0 10px rgba(184,134,11,0.3);
}
.disclaimer {
background: rgba(184,134,11,0.1);
border: 1px solid #b8860b;
border-radius: 10px;
padding: 12px;
color: #b8860b;
font-size: 0.9em;
margin-top: 25px;
max-width: 440px;
text-align: center;
box-shadow: 0 0 15px rgba(184,134,11,0.2);
} </style>
</head> <body>
<div class="glitter"></div>
<img src="logo.png" alt="Amazing Financial LLC Logo" class="logo">

<h1>Free Estimator</h1>
<div class="calculator">
<label for="filingStatus">Filing Status:</label> <select id="filingStatus">
<option value="single">Single</option>
<option value="married">Married Filing Jointly</option> <option value="head">Head of Household</option>
</select>
<label for="income">Annual Income ($):</label>
<input type="number" id="income" placeholder="Enter your total income" />
<label for="taxWithheld">Tax Withheld ($):</label>

 <input type="number" id="taxWithheld" placeholder="Enter tax already withheld" />
<label for="dependents">Dependents:</label>
<input type="number" id="dependents" placeholder="Enter number of dependents" />
<label for="student">Are you a student?</label> <select id="student">
<option value="no">No</option>
<option value="yes">Yes</option> </select>
<button id="calcBtn">Calculate Refund</button>
<div class="result" id="result"></div> </div>
<div class="disclaimer"> Disclaimer: This is only an <strong>ESTIMATED</strong> number, not the actual refund amount! Actual results may vary depending on your full tax situation.</div>
<script>
document.getElementById('calcBtn').addEventListener('click', calculateRefund);
function createGlitter() {
const glitter = document.createElement('div'); glitter.classList.add('glitter');
glitter.style.left = Math.random() * window.innerWidth + 'px'; glitter.style.top = Math.random() * window.innerHeight + 'px'; document.body.appendChild(glitter);
setTimeout(() => glitter.remove(), 3000);
}
setInterval(createGlitter, 150);
function calculateTax(income, status) { const brackets = {
single: [
{ limit: 11000, rate: 0.10 },
{ limit: 44725, rate: 0.12 }, { limit: 95375, rate: 0.22 }, { limit: 182100, rate: 0.24 }, { limit: 231250, rate: 0.32 }, { limit: 578125, rate: 0.35 }, { limit: Infinity, rate: 0.37 }
],
⚠

 married: [
{ limit: 22000, rate: 0.10 }, { limit: 89450, rate: 0.12 }, { limit: 190750, rate: 0.22 }, { limit: 364200, rate: 0.24 }, { limit: 462500, rate: 0.32 }, { limit: 693750, rate: 0.35 }, { limit: Infinity, rate: 0.37 }
], head: [
{ limit: 15700, rate: 0.10 }, { limit: 59850, rate: 0.12 }, { limit: 95350, rate: 0.22 }, { limit: 182100, rate: 0.24 }, { limit: 231250, rate: 0.32 }, { limit: 578100, rate: 0.35 }, { limit: Infinity, rate: 0.37 }
] };
let taxableIncome = income;
if (taxableIncome <= 0) return 0;
let tax = 0;
let lastLimit = 0;
const selectedBrackets = brackets[status];
for (let i = 0; i < selectedBrackets.length; i++) { const { limit, rate } = selectedBrackets[i];
if (taxableIncome > limit) {
tax += (limit - lastLimit) * rate;
lastLimit = limit; } else {
tax += (taxableIncome - lastLimit) * rate;
break; }
}
return tax; }
function calculateRefund() {
const income = parseFloat(document.getElementById('income').value) || 0; const withheld = parseFloat(document.getElementById('taxWithheld').value) || 0;

 const dependents = parseInt(document.getElementById('dependents').value) || 0; const status = document.getElementById('filingStatus').value;
const student = document.getElementById('student').value;
const taxOwed = calculateTax(income, status);
const dependentCredit = dependents * 2200;
const studentBonus = student === 'yes' ? 1000 : 0; const totalCredits = dependentCredit + studentBonus;
const refund = withheld - taxOwed + totalCredits;
const resultDiv = document.getElementById('result'); if (refund > 0) {
resultDiv.textContent = `Estimated Refund: $${refund.toFixed(2)} (Includes $${dependentCredit} from dependents${student === 'yes' ? ' and $1000 student bonus' : ''})`;
} else if (refund < 0) {
resultDiv.textContent = `Estimated Amount Owed: $${Math.abs(refund).toFixed(2)}`;
} else {
resultDiv.textContent = 'You broke even — no refund or amount owed.';
} }
</script> </body> </html>
